[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vajra-space-evidence-lab"
version = "0.4.0"
description = "Evidence validation infrastructure for space science and space safety"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
  "jsonschema>=4.22"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
vajra-space = "vajra_space.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
