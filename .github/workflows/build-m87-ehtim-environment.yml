name: build-m87-ehtim-environment

on:
  workflow_dispatch:
  push:
    paths:
      - containers/m87-ehtim/**
      - scripts/write_explicit_conda_lock.py
      - .github/workflows/build-m87-ehtim-environment.yml
  pull_request:
    paths:
      - containers/m87-ehtim/**
      - scripts/write_explicit_conda_lock.py
      - .github/workflows/build-m87-ehtim-environment.yml

permissions:
  contents: read
  packages: write

jobs:
  lock-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_TAG: mambaorg/micromamba:1-bookworm-slim
      EHTIM_COMMIT: 22ae35f307921a4d423aa69f6aed6e93a74ecbc0
      IMAGE: ghcr.io/safal207/vajra-m87-ehtim
      PATCH_PATH: containers/m87-ehtim/patches/ehtim-1.1.0-python3-parloop.patch
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve immutable base-image digest
        id: base
        shell: bash
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$BASE_TAG")"
          printf '%s\n' "$inspect"
          digest="$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$digest"
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$BASE_TAG@$digest" >> "$GITHUB_OUTPUT"

      - name: Solve explicit Conda environment
        shell: bash
        run: |
          set +e
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/work" \
            "${{ steps.base.outputs.reference }}" \
            bash -lc '
              set -euo pipefail
              micromamba create --yes --name lock -f /work/containers/m87-ehtim/environment.seed.yml
              micromamba list --name lock --json > /work/containers/m87-ehtim/micromamba-packages.json
              micromamba run --name lock python /work/scripts/write_explicit_conda_lock.py \
                --prefix /opt/conda/envs/lock \
                --output /work/containers/m87-ehtim/explicit-linux-64.txt
            ' >m87-conda-solve.log 2>&1
          rc=$?
          set -e
          cat m87-conda-solve.log
          if [ "$rc" -eq 0 ]; then
            test -s containers/m87-ehtim/explicit-linux-64.txt
          fi
          exit "$rc"

      - name: Upload solver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m87-ehtim-solver-diagnostics
          path: |
            m87-conda-solve.log
            containers/m87-ehtim/environment.seed.yml
            containers/m87-ehtim/micromamba-packages.json
            containers/m87-ehtim/explicit-linux-64.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Hash exact upstream tree and compatibility patch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/achael/eht-imaging.git /tmp/eht-imaging
          git -C /tmp/eht-imaging checkout --detach "$EHTIM_COMMIT"
          test "$(git -C /tmp/eht-imaging rev-parse HEAD)" = "$EHTIM_COMMIT"
          tree_sha256="$(git -C /tmp/eht-imaging archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          patch_sha256="$(sha256sum "$PATCH_PATH" | awk '{print $1}')"
          git -C /tmp/eht-imaging apply --check "$GITHUB_WORKSPACE/$PATCH_PATH"
          echo "tree_sha256=$tree_sha256" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$patch_sha256" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish digest-addressed OCI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: containers/m87-ehtim
          file: containers/m87-ehtim/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.reference }}
            EHTIM_COMMIT=${{ env.EHTIM_COMMIT }}
            EHTIM_TREE_SHA256=${{ steps.source.outputs.tree_sha256 }}
            EHTIM_PATCH_SHA256=${{ steps.source.outputs.patch_sha256 }}

      - name: Pull and smoke-test published image by digest
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          docker run --rm "$ref" python -c 'import pkg_resources, ehtim; assert pkg_resources.get_distribution("ehtim").version == "1.1.0"; print("ehtim-1.1.0-ready")'

          git clone --depth 1 https://github.com/eventhorizontelescope/2019-D01-02.git /tmp/eht-imaging-release
          git -C /tmp/eht-imaging-release fetch --depth 1 origin 80d230e76c08edd31548e7cfe61dc7cf94300780
          git -C /tmp/eht-imaging-release checkout --detach 80d230e76c08edd31548e7cfe61dc7cf94300780
          docker run --rm \
            -v /tmp/eht-imaging-release:/release:ro \
            "$ref" \
            python /release/eht-imaging/eht-imaging_pipeline.py --help >/tmp/pipeline-help.txt
          grep -F "Fiducial eht-imaging script for M87" /tmp/pipeline-help.txt

      - name: Write environment provenance report
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock = Path('containers/m87-ehtim/explicit-linux-64.txt')
          report = {
              'report_version': 1,
              'base_tag': '${{ env.BASE_TAG }}',
              'base_digest': '${{ steps.base.outputs.digest }}',
              'base_reference': '${{ steps.base.outputs.reference }}',
              'ehtim_repository': 'https://github.com/achael/eht-imaging.git',
              'ehtim_commit': '${{ env.EHTIM_COMMIT }}',
              'ehtim_tree_sha256': '${{ steps.source.outputs.tree_sha256 }}',
              'compatibility_patch_path': '${{ env.PATCH_PATH }}',
              'compatibility_patch_sha256': '${{ steps.source.outputs.patch_sha256 }}',
              'environment_lock_sha256': hashlib.sha256(lock.read_bytes()).hexdigest(),
              'oci_image': '${{ env.IMAGE }}',
              'oci_digest': '${{ steps.build.outputs.digest }}',
              'platform': 'linux/amd64',
              'workflow_repository': '${{ github.repository }}',
              'workflow_commit': '${{ github.sha }}',
          }
          Path('m87-ehtim-environment-provenance.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload lock and provenance
        uses: actions/upload-artifact@v4
        with:
          name: m87-ehtim-environment
          path: |
            containers/m87-ehtim/explicit-linux-64.txt
            m87-ehtim-environment-provenance.json
          if-no-files-found: error
          retention-days: 30
